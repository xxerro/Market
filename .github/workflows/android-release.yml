name: Android APK download

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze
        continue-on-error: true

      - name: Run Flutter tests
        run: flutter test --reporter expanded
        continue-on-error: true

      - name: Build tested debug APK
        run: flutter build apk --debug

      - name: Prepare downloadable APK
        shell: bash
        run: cp build/app/outputs/flutter-apk/app-debug.apk Market-debug.apk

      - name: Publish test APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-latest
          name: Android test APK (Debug)
          target_commitish: main
          make_latest: true
          overwrite_files: true
          files: build/app/outputs/flutter-apk/app-release.apk
